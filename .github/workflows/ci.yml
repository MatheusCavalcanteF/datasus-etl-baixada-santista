name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 3.12 é o mínimo do numpy 2.5 e a última versão com wheel do datasus-dbc para Linux.
      # No 3.14 (ambiente local) o datasus-dbc compila do código-fonte em Rust.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest
